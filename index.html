<style>
:root{--bg:#0a0e1f;--bg2:#141a35;--card:#f1e6c8;--ink:#2b2114;--gold:#d4af37;--tx:#e9e4d3;--mut:#9aa0b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

.arw{align-self:center;color:var(--gold);font-size:24px;text-shadow:0 0 8px var(--gold)}

.pv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:24px;text-align:left}
.flap{position:absolute;top:-56px;left:-3px;right:-3px;height:58px;background:#d11a20;clip-path:polygon(0 100%,50% 0,100% 100%);filter:drop-shadow(0 0 6px #ff2a2a)}
.letter{position:relative;background:var(--card);color:#2b2114;border-radius:4px;padding:14px;text-align:center;box-shadow:0 -4px 12px #0006;margin-top:-20px}
.letter h2{color:#b00;letter-spacing:3px;margin:0 0 6px}.letter p{font-weight:bold;margin:8px 0 12px}.star{position:fixed;width:2px;height:2px;background:#ffe58a;border-radius:50%;animation:tw 3s infinite;z-index:0}
